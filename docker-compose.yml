# One-command setup: docker compose up  ->  open http://localhost:8501 (Streamlit)
# or http://localhost:8000/hud (J.A.R.V.I.S. console with the voice HUD).
# Needs NVIDIA_API_KEY in .env (free key from build.nvidia.com).
# Ports are bound to 127.0.0.1 only, so nobody on the local network can click Approve.
services:
  searxng:
    image: searxng/searxng:2026.10.29-c15647b5a
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-dev-only-change-me}"
    volumes: ["./config/searxng:/etc/searxng"]

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &env
      SEARXNG_URL: "http://searxng:8080"
      PROVEIT_DB: "/app/data/proveit.db"
      SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      SE_KEY: "${SE_KEY:-}"
      # The model is hosted by NVIDIA (free developer tier); docker compose reads the key from .env.
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}"
      API_PUBLIC_URL: "http://localhost:8000"
      JARVIS_ADDRESS: "${JARVIS_ADDRESS:-Sir}"
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["proveit-data:/app/data", "./outputs:/app/outputs", "./runs:/app/runs"]
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  ui:
    build: .
    command: ["streamlit", "run", "app/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--browser.gatherUsageStats", "false"]
    environment: *env
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["proveit-data:/app/data", "./outputs:/app/outputs", "./runs:/app/runs"]
    ports: ["127.0.0.1:8501:8501"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      searxng: { condition: service_started }
      api: { condition: service_started }

volumes: { proveit-data: {} }
