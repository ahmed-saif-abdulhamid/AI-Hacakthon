# One-command setup: docker compose up  ->  open http://localhost:8501 (Streamlit)
# or http://localhost:8000/hud (J.A.R.V.I.S. console with the voice HUD).
# Ports are bound to 127.0.0.1 only, so nobody on the local network can click Approve.
services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes: [ollama:/root/.ollama]
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 5s, timeout: 5s, retries: 60 }

  ollama-pull:
    image: ollama/ollama:0.40.16
    depends_on: { ollama: { condition: service_healthy } }
    environment:
      OLLAMA_HOST: "ollama:11434"
      MODEL: "${MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      SKIP_PULL: "${SKIP_PULL:-0}"
    # Works offline once the model is present; SKIP_PULL=1 when using the host's native Ollama.
    entrypoint: ["sh", "-c", "[ \"$$SKIP_PULL\" = 1 ] || ollama list | grep -q \"$$MODEL\" || ollama pull \"$$MODEL\""]

  searxng:
    image: searxng/searxng:2026.10.29-c15647b5a
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-dev-only-change-me}"
    volumes: ["./config/searxng:/etc/searxng"]

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &env
      MODEL: "${MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://ollama:11434}"
      SEARXNG_URL: "http://searxng:8080"
      PROVEIT_DB: "/app/data/proveit.db"
      SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      SE_KEY: "${SE_KEY:-}"
      API_PUBLIC_URL: "http://localhost:8000"
      JARVIS_ADDRESS: "${JARVIS_ADDRESS:-Sir}"
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["proveit-data:/app/data", "./outputs:/app/outputs", "./runs:/app/runs"]
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  ui:
    build: .
    command: ["streamlit", "run", "app/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--browser.gatherUsageStats", "false"]
    environment: *env
    user: "${UID:-1000}:${GID:-1000}"
    volumes: ["proveit-data:/app/data", "./outputs:/app/outputs", "./runs:/app/runs"]
    ports: ["127.0.0.1:8501:8501"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      ollama-pull: { condition: service_started }
      searxng: { condition: service_started }
      api: { condition: service_started }

volumes: { ollama: {}, proveit-data: {} }
