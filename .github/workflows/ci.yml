name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # The smoke tests use a fake LLM fixture that lives only in tests/; real runs use the hosted open-weight model.
      - run: python -m pytest
      - name: No secrets committed
        run: "! git grep -nE \"sk-[A-Za-z0-9]{20}|nvapi-[A-Za-z0-9_-]{20}|ghp_[A-Za-z0-9]{20}|api_key\\s*=\\s*['\\\"][^'\\\"]\" -- . ':!tests'"

  compose:
    # Proves the one-command setup: build the image, start the stack, check the console answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build --build-arg INSTALL_VOICE=0
      - run: docker compose up -d
      - name: Console and API answer
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/model && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/hud | grep -q "ProveIt"
          curl -fsS http://127.0.0.1:8000/api/runs | grep -q "stop"   # committed runs loaded, no key needed
      - if: always()
        run: docker compose logs --no-color | tail -n 200
      - if: always()
        run: docker compose down -v
