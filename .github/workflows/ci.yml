name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      # The smoke tests use a fake LLM fixture that lives only in tests/; real runs use the open-weight model.
      - run: python -m pytest
      - name: No secrets committed
        run: "! git grep -nE \"sk-[A-Za-z0-9]{20}|api_key\\s*=\\s*['\\\"][^'\\\"]\" -- . ':!tests'"
