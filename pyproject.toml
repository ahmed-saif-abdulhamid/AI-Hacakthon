[project]
name = "proveit"
version = "0.2.0"
description = "J.A.R.V.I.S. by ProveIt: an open-source team of AI agents that tests a founder's idea before it is built."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["deploy/vercel_site", "data", "runs"]

[tool.ruff.lint]
# C90/PLR09: every function stays small and simple (cyclomatic complexity <= 10).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C90", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Long string literals (prompts, user-facing copy, regexes) are clearer unbroken.
"*" = ["E501"]
# FastAPI declares request parameters with File(...)/Form(...) defaults by design.
"app/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
